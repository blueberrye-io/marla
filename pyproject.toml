[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marla"
version = "0.1.0"
description = "MARLA — Messages And Registers: Language with Actors. Phase-1-Compiler (.mar -> C99)."
requires-python = ">=3.10"

[project.scripts]
marla = "marla.cli:main"

[tool.setuptools]
packages = ["marla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
